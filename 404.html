<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#090909">
<title>صفحه پیدا نشد | مدرن اسمارت کی</title>
<style>
:root{color-scheme:dark;--gold:#d6ad62;--text:#f5f2eb;--muted:#b9b4aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,rgba(214,173,98,.14),transparent 55%),#090909;color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:2}
main{width:min(620px,100%);text-align:center;border:1px solid rgba(214,173,98,.25);border-radius:18px;padding:clamp(26px,6vw,52px);background:#141414}
.code{font-size:clamp(64px,15vw,110px);font-weight:900;line-height:1;color:var(--gold);direction:ltr}
h1{font-size:clamp(22px,5vw,30px);margin:22px 0 8px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;margin:6px;padding:11px 20px;border-radius:8px;text-decoration:none;font-weight:700}
.primary{background:linear-gradient(135deg,#f2d99e,var(--gold));color:#15110a}
.secondary{border:1px solid var(--gold);color:#f2d99e}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>این صفحه پیدا نشد</h1>
<p>ممکن است نشانی صفحه تغییر کرده باشد یا صفحه موردنظر در دسترس نباشد. از صفحه اصلی خدمات ساخت کلید و ریموت خودرو را دنبال کنید.</p>
<a class="primary" href="./">بازگشت به صفحه اصلی</a>
<a class="secondary" href="./#contact">تماس با مدرن اسمارت کی</a>
</main>
</body>
</html>
